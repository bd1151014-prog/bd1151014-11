<!DOCTYPE html>

    <!-- 引入 Tailwind CSS 進行快速且現代的排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Font Awesome 以使用精美的圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Google Fonts 中文字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc; /* 乾淨的淺灰背景 */
        }
        
        /* 簡單的載入動畫 */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="text-slate-700 antialiased min-h-screen flex items-center justify-center p-4 md:p-8">

                            </span>
                            <span class="px-4 py-2 bg-blue-50 border border-blue-100 text-blue-700 rounded-xl font-medium flex items-center gap-2">

                                <i class="fa-solid fa-book-open text-emerald-400"></i> 讀書
                            </span>
                            <span class="px-4 py-2 bg-emerald-50 border border-emerald-100 text-emerald-700 rounded-xl font-medium flex items-center gap-2">
                                <i class="fa-solid fa-bed text-emerald-400"></i> 睡覺

                <div class="bg-slate-50 rounded-2xl p-6 md:p-8 border border-slate-100 h-full">
                    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-3">

                                <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors shrink-0">

                                    <p class="text-xs text-slate-400 mb-1">Email</p>
                                    <p class="text-slate-800 font-medium truncate">bd1151014@venus.lit.edu.tw</p>
                                </div>
                            </a>
                        </li>
                        
                        <!-- Line -->
                        <li>
                            <div class="group flex items-center gap-4 p-4 rounded-xl bg-white shadow-sm hover:shadow-md transition-all border border-slate-100 hover:border-green-200 cursor-default">
