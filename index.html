<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 引入 Tailwind CSS 用於快速樣式設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 FontAwesome 用於圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入 Google 字體 (Noto Sans TC) 以優化中文顯示 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc; /* 非常淺的灰藍色背景，營造乾淨明亮的感覺 */
        }
        
        /* 卡片懸停動畫效果 */
        .hover-card-effect {
            transition: all 0.3s ease;
        }
        .hover-card-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen py-10 px-4 sm:px-6 lg:px-8">

    <!-- 主要容器 -->
    <main class="max-w-4xl mx-auto space-y-8">
        
        <!-- 頂部區塊：個人簡介與照片 (Hero Section) -->
        <section class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover-card-effect p-8 sm:p-10 flex flex-col md:flex-row items-center gap-10">
            <!-- 照片區塊 (預留照片位置) -->
            <div class="flex-shrink-0 relative group cursor-pointer">

                <img src="https://placehold.co/400x400/e2e8f0/475569?text=照片放置處" 
                     alt="李梅花的照片" 
                     class="w-48 h-48 md:w-56 md:h-56 rounded-full object-cover shadow-md border-4 border-white transition-transform duration-300 group-hover:scale-105">
                <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-20 rounded-full transition-all duration-300 flex items-center justify-center">
                    <span class="text-white opacity-0 group-hover:opacity-100 font-medium drop-shadow-md">更換照片</span>
                </div>
            </div>

            <!-- 文字介紹區塊 -->

                <p class="text-indigo-600 font-medium text-lg mt-2 flex items-center justify-center md:justify-start gap-2">
                    <i class="fa-solid fa-graduation-cap"></i>
                    黎明技術學院 數位多媒體系
                </p>
                <div class="mt-5 relative">
                    <div class="absolute -left-4 top-0 text-gray-200 text-4xl hidden md:block">"</div>
                    <p class="text-gray-600 text-lg leading-relaxed relative z-10 md:pl-2">
                        喜歡簡單生活，也喜歡認真對待每㇐件事。
                    </p>
                </div>
            </div>
        </section>

        <!-- 網格佈局：技能、興趣與聯絡方式 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- 左側欄：技能與興趣 (佔據 2 列寬度) -->
            <div class="md:col-span-2 space-y-8">
                
                <!-- 技能區塊 -->
                <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 hover-card-effect h-full">

                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">我的技能</h2>
                    </div>
                    
                    <div class="flex flex-wrap gap-4 mt-4">
                        <!-- 技能標籤 1 -->
                        <div class="px-5 py-3 bg-gray-50 border border-gray-100 rounded-2xl flex items-center gap-3 hover:bg-indigo-50 hover:border-indigo-100 transition-colors">
                            <i class="fa-solid fa-code text-indigo-500"></i>
                            <span class="font-medium text-gray-700 text-lg">寫代碼</span>
                        </div>
                        <!-- 技能標籤 2 -->
                        <div class="px-5 py-3 bg-gray-50 border border-gray-100 rounded-2xl flex items-center gap-3 hover:bg-indigo-50 hover:border-indigo-100 transition-colors">

            <div class="space-y-8">

                <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 hover-card-effect">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center text-rose-500">
                            <i class="fa-solid fa-heart text-xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">我的興趣</h2>
                    </div>
                    
                    <ul class="space-y-4">
                        <li class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl">
                            <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-600">
                                <i class="fa-solid fa-headphones"></i>
                            </div>
                            <span class="font-medium text-gray-700">聽音樂</span>
                        </li>
                        <li class="flex items-center gap-4 bg-gray-50 p-4 rounded-2xl">
                            <div class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-600">
                                <i class="fa-solid fa-bed"></i>
                            </div>
                            <span class="font-medium text-gray-700">睡覺</span>

                <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 hover-card-effect">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500">
                            <i class="fa-solid fa-address-card text-xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800">聯繫方式</h2>
                    </div>
                    
                    <div class="space-y-5">
                        <!-- Email -->
                        <div class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 group-hover:bg-emerald-50 group-hover:text-emerald-600 transition-colors flex-shrink-0">
                                <i class="fa-solid fa-envelope"></i>
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm text-gray-500 mb-0.5">Email</p>
                                <a href="mailto:bd1151014@venus.lit.edu.tw" class="font-medium text-gray-800 hover:text-emerald-600 transition-colors truncate block text-sm sm:text-base">
                                    bd1151014@venus.lit.edu.tw
                                </a>
                            </div>
                        </div>

                        <!-- Line -->
                        <div class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 group-hover:bg-[#00B900] group-hover:text-white transition-colors flex-shrink-0">

                        <!-- Instagram -->
                        <div class="flex items-start gap-4 group">
                            <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-500 group-hover:bg-gradient-to-tr group-hover:from-yellow-400 group-hover:via-red-500 group-hover:to-purple-500 group-hover:text-white transition-all flex-shrink-0">
                                <i class="fa-brands fa-instagram text-lg"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500 mb-0.5">Instagram</p>
                                <a href="https://instagram.com/thip._.1234" target="_blank" class="font-medium text-gray-800 hover:text-pink-600 transition-colors">
                                    thip._.1234
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
                
            </div>
        </div>

        <!-- 頁尾 -->
        <footer class="text-center text-gray-400 text-sm pt-8 pb-4">
            <p>&copy; 2026 李梅花. All rights reserved.</p>
        </footer>

    </main>

</body>
</html>
